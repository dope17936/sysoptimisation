name: Build APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git \
            python3-dev \
            openjdk-17-jdk \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            libtool \
            autoconf \
            automake \
            pkg-config \
            make \
            zip \
            unzip \
            wget

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade setuptools==65.5.0 cython buildozer

    - name: Pre-setup Android SDK & Tools
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk
        cd ~/.buildozer/android/platform/android-sdk
        
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdtools.zip
        unzip -q cmdtools.zip
        rm -rf tools
        mv cmdline-tools tools
        rm cmdtools.zip

        mkdir -p licenses
        echo "84831b4009ab44a7f6430da4b82caeb83ac6f6e" > licenses/android-sdk-license
        echo "2433034e365696d5b058f8849b062534571cd014" >> licenses/android-sdk-license
        echo "d56f518747f45122f81500cef3e32e316a5a060b" >> licenses/android-sdk-license
        echo "286e3cedb915d26f714c5b364e7c7a1950e8d328" >> licenses/android-sdk-license

    - name: Build APK with Buildozer
      run: |
        script -q -e -c "yes | buildozer android debug" /dev/null

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk

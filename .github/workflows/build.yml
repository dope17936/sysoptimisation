name: Build APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git \
            python3-dev \
            openjdk-17-jdk \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            libtool \
            autoconf \
            automake \
            pkg-config \
            make \
            zip \
            unzip \
            wget

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade setuptools==65.5.0 cython buildozer

    - name: Prepare Android SDK Tools & Licenses
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk/tools
        cd ~/.buildozer/android/platform/android-sdk
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O commandlinetools.zip
        unzip -q commandlinetools.zip
        mkdir -p tools/bin
        mv cmdline-tools/bin/* tools/bin/
        mv cmdline-tools/lib tools/
        rm -rf cmdline-tools commandlinetools.zip
        
        # Pré-valide toutes les licences pour éviter les blocages
        mkdir -p licenses
        echo "84831b4009ab44a7f6430da4b82caeb83ac6f6e" > licenses/android-sdk-license
        echo "2433034e365696d5b058f8849b062534571cd014" >> licenses/android-sdk-license
        echo "d56f518747f45122f81500cef3e32e316a5a060b" >> licenses/android-sdk-license

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
        

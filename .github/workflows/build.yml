name: Build APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git \
            python3-dev \
            openjdk-17-jdk \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            libtool \
            autoconf \
            automake \
            pkg-config \
            make \
            zip \
            unzip

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade setuptools==65.5.0 cython buildozer

    - name: Build APK with Buildozer (Auto-accept via Terminal Simulation)
      run: |
        script -q -e -c "yes | buildozer -v android debug" /dev/null

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
